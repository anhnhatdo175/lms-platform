      tags:
      - admin
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AdaptiveSessionStatus'
      - name: courseId
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdaptiveTaskSessionPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/InternalError'
      security:
