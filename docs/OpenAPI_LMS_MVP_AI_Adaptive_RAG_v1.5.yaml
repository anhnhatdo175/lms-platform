      x-scope: SHOULD
  /teacher/courses/{courseId}/reopen:
    post:
      operationId: reopenCourse
      summary: Mở lại Course bị từ chối để chỉnh sửa
      tags:
      - teacher
      description: REJECTED → DRAFT. Thao tác rõ ràng, ghi AuditLog; không chuyển ngầm khi gọi API sửa nội dung. Course không ở REJECTED → 409
        STATE_CONFLICT.
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDecisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/InternalError'
      security:
      - BearerAuth: []
      x-scope: MUST
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token. Không dùng cho refresh token.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Cookie HttpOnly do server thiết lập; không đọc/ghi bằng JavaScript.
    SepayApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: 'SePay gửi header ''Authorization: Apikey <KEY>''. Backend so khớp với key cấu hình; không dùng JWT user.'
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - traceId
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  reason:
                    type: string
                additionalProperties: true
            traceId:
              type: string
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - displayName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          writeOnly: true
        displayName:
          type: string
          minLength: 1
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    ForgotPasswordRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required:
      - token
      - newPassword
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
          writeOnly: true
    UpdateMeRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
        avatarResourceId:
          type:
          - integer
          - 'null'
          format: int64
      additionalProperties: false
    CreateCourseRequest:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        shortDescription:
          type: string
        description:
          type: string
        categoryId:
          type: integer
          format: int64
          minimum: 1
        originalPrice:
          $ref: '#/components/schemas/Money'
        salePrice:
          $ref: '#/components/schemas/Money'
        thumbnailResourceId:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        subjectCode:
          type:
          - string
          - 'null'
        gradeLevel:
          type:
          - string
          - 'null'
        accessDurationDays:
          type:
          - integer
          - 'null'
          minimum: 1
          description: NULL = không giới hạn.
        completionRule:
          $ref: '#/components/schemas/CourseCompletionRule'
      additionalProperties: false
      required:
      - title
      - slug
      - categoryId
      - originalPrice
      - salePrice
      description: salePrice ≤ originalPrice; cả hai là VND.
    UpdateCourseRequest:
      type: object
      properties:
        title:
          type: string
        shortDescription:
          type: string
        description:
          type: string
        categoryId:
          type: integer
          format: int64
          minimum: 1
        originalPrice:
          $ref: '#/components/schemas/Money'
        salePrice:
          $ref: '#/components/schemas/Money'
        thumbnailResourceId:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        subjectCode:
          type:
          - string
          - 'null'
        gradeLevel:
          type:
          - string
          - 'null'
        accessDurationDays:
          type:
          - integer
          - 'null'
          minimum: 1
          description: NULL = không giới hạn.
        completionRule:
          $ref: '#/components/schemas/CourseCompletionRule'
      additionalProperties: false
      description: Slug không đổi sau khi tạo.
    CreateSectionRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        position:
          type: integer
          minimum: 1
          description: Bỏ trống = thêm vào cuối.
        published:
          type: boolean
          default: false
        releaseAfterDays:
          type: integer
          minimum: 0
          default: 0
          description: 'Drip content: số ngày sau thời điểm Enrollment bắt đầu.'
      additionalProperties: false
      required:
      - title
    UpdateSectionRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        published:
          type: boolean
          default: false
        releaseAfterDays:
          type: integer
          minimum: 0
          default: 0
          description: 'Drip content: số ngày sau thời điểm Enrollment bắt đầu.'
      additionalProperties: false
      description: Đổi thứ tự dùng PUT /teacher/courses/{courseId}/curriculum/order.
    CreateLessonRequest:
      type: object
      properties:
        lessonType:
          $ref: '#/components/schemas/LessonType'
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        content:
          type:
          - string
          - 'null'
        videoResourceId:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        durationSeconds:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Thời lượng do server lưu; heartbeat không gửi lại.
        preview:
          type: boolean
          default: false
        published:
          type: boolean
          default: false
        mandatory:
          type: boolean
          default: true
        completionMethod:
          $ref: '#/components/schemas/CompletionMethod'
        completionThreshold:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
          description: Dùng cho VIDEO_PERCENT/PASS_EXAM.
        position:
          type: integer
          minimum: 1
          description: Bỏ trống = thêm vào cuối.
      additionalProperties: false
      required:
      - title
      - lessonType
    UpdateLessonRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        content:
          type:
          - string
          - 'null'
        videoResourceId:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        durationSeconds:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Thời lượng do server lưu; heartbeat không gửi lại.
        preview:
          type: boolean
          default: false
        published:
          type: boolean
          default: false
        mandatory:
          type: boolean
          default: true
        completionMethod:
          $ref: '#/components/schemas/CompletionMethod'
        completionThreshold:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
          description: Dùng cho VIDEO_PERCENT/PASS_EXAM.
      additionalProperties: false
      description: lessonType không đổi sau khi tạo. Đổi thứ tự dùng API reorder.
    AttachResourceRequest:
      type: object
      properties:
        resourceId:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
        resourceType:
          $ref: '#/components/schemas/LessonResourceType'
        downloadable:
          type: boolean
          default: true
        position:
          type: integer
          minimum: 1
      additionalProperties: false
      required:
      - resourceId
    ReviewSubmissionRequest:
      type: object
      properties:
        note:
          type: string
      additionalProperties: false
    ReviewDecisionRequest:
      type: object
      properties:
        reason:
          type: string
      additionalProperties: false
    HideCourseRequest:
      type: object
      properties:
        reason:
          type: string
      additionalProperties: false
    CreateUploadUrlRequest:
      type: object
      required:
      - fileName
      - contentType
      - sizeBytes
      - purpose
      properties:
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        purpose:
          type: string
          enum:
          - LESSON_RESOURCE
          - COURSE_THUMBNAIL
          - AI_SOURCE
    CompleteUploadRequest:
      type: object
      required:
      - uploadId
      properties:
        uploadId:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
    CartItemRequest:
      type: object
      required:
      - courseId
      properties:
        courseId:
          type: integer
          format: int64
    CheckoutRequest:
      type: object
      properties:
        couponCode:
          type:
          - string
          - 'null'
        paymentMethod:
          type: string
          enum:
          - SEPAY_BANK_TRANSFER
          default: SEPAY_BANK_TRANSFER
      additionalProperties: false
      example:
        couponCode: null
        paymentMethod: SEPAY_BANK_TRANSFER
      description: Header Idempotency-Key bắt buộc. Cùng key và cùng nội dung → 200 trả Order cũ; cùng key khác nội dung → 409 IDEMPOTENCY_KEY_REUSED.
    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
    SepayWebhookRequest:
      type: object
      description: Payload phụ thuộc schema và chữ ký chính thức của SePay; cần xác nhận theo cấu hình provider.
      additionalProperties: true
    ReconciliationMatchRequest:
      type: object
      required:
      - paymentId
      - reason
      properties:
        paymentId:
          type: integer
          format: int64
        reason:
          type: string
          minLength: 1
    ReconciliationDecisionRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
      required:
      - reason
    LessonHeartbeatRequest:
      type: object
      required:
      - positionSeconds
      - clientEventId
      properties:
        positionSeconds:
          type: integer
          minimum: 0
        clientEventId:
          type: string
          format: uuid
      description: Server lấy thời lượng từ lessons.duration_seconds; client chỉ báo vị trí và clientEventId.
    CompleteLessonRequest:
      type: object
      properties:
        clientEventId:
          type: string
          format: uuid
    ProgressOverrideRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - COMPLETED
          - NOT_STARTED
        reason:
          type: string
          minLength: 1
      additionalProperties: false
      required:
      - status
      - reason
    CreateExamRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        durationMinutes:
          type: integer
          minimum: 1
        passingScore:
          type: number
          minimum: 0
          maximum: 100
          description: Điểm đạt theo %.
        maximumAttempts:
          type:
          - integer
          - 'null'
          minimum: 1
          description: NULL = không giới hạn.
        shuffleQuestions:
          type: boolean
          default: false
        shuffleOptions:
          type: boolean
          default: false
        resultDisplayMode:
          $ref: '#/components/schemas/ExamResultDisplayMode'
        startAt:
          type:
          - string
          - 'null'
          format: date-time
        endAt:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
      required:
      - title
      - durationMinutes
      - passingScore
    UpdateExamRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        durationMinutes:
          type: integer
          minimum: 1
        passingScore:
          type: number
          minimum: 0
          maximum: 100
          description: Điểm đạt theo %.
        maximumAttempts:
          type:
          - integer
          - 'null'
          minimum: 1
          description: NULL = không giới hạn.
        shuffleQuestions:
          type: boolean
          default: false
        shuffleOptions:
          type: boolean
          default: false
        resultDisplayMode:
          $ref: '#/components/schemas/ExamResultDisplayMode'
        startAt:
          type:
          - string
          - 'null'
          format: date-time
        endAt:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    AddExamQuestionRequest:
      type: object
      properties:
        questionId:
          type: integer
          format: int64
          minimum: 1
        position:
          type: integer
          minimum: 1
        score:
          type: number
          minimum: 0
        required:
          type: boolean
          default: true
      additionalProperties: false
      required:
      - questionId
      - score
    StartExamAttemptRequest:
      type: object
      properties:
        clientRequestId:
          type: string
          format: uuid
    ExamAnswerRequest:
      type: object
      properties:
        selectedOptionIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
        version:
          type: integer
          minimum: 0
          description: Optimistic lock của Attempt.
      additionalProperties: false
      required:
      - selectedOptionIds
      description: Gửi mảng rỗng để bỏ chọn.
    SubmitExamRequest:
      type: object
      properties:
        clientEventId:
          type: string
          format: uuid
    CreateKnowledgeDocumentRequest:
      oneOf:
      - $ref: '#/components/schemas/CreateKnowledgeDocumentFileRequest'
      - $ref: '#/components/schemas/CreateKnowledgeDocumentTextRequest'
      discriminator:
        propertyName: sourceType
        mapping:
          LMS_FILE: '#/components/schemas/CreateKnowledgeDocumentFileRequest'
          PASTED_TEXT: '#/components/schemas/CreateKnowledgeDocumentTextRequest'
      description: 'sourceType quyết định payload và loại trừ lẫn nhau: LMS_FILE ⇔ fileResourceId, PASTED_TEXT ⇔ textContent. Sai/thiếu/thừa trường
        → 422.'
    CreateAdaptiveTaskSessionRequest:
      type: object
      properties:
        courseId:
          type: integer
          format: int64
          minimum: 1
        lessonId:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        targetTopics:
          type: array
          items:
            type: string
          description: Thu hẹp trong allowedSkills của cấu hình.
        taskCount:
          type: integer
          minimum: 1
          maximum: 10
        taskTypes:
          type: array
          items:
            $ref: '#/components/schemas/AdaptiveTaskType'
          minItems: 1
          description: Phải nằm trong allowedTaskTypes.
        clientRequestId:
          type: string
          format: uuid
          description: Idempotency tạo phiên.
      additionalProperties: false
      required:
      - courseId
      - taskCount
      - clientRequestId
      description: 'Student không gửi môn học, khối/lớp hay độ khó: các ràng buộc do Teacher cấu hình, độ khó từng nhiệm vụ do server chọn theo
        ZPD và kẹp trong [minDifficulty, maxDifficulty]. Yêu cầu ngoài phạm vi → 422 AI_REQUEST_OUT_OF_BOUNDS; chưa cấu hình → 422 AI_NOT_CONFIGURED.'
      example:
        courseId: 101
        lessonId: 205
        targetTopics:
        - fractions
        taskCount: 5
        taskTypes:
        - MULTIPLE_CHOICE
        clientRequestId: 0f0e8c6e-4f3a-4b64-9a22-6a1a9d7b8c11
    AdaptiveTaskAttemptRequest:
      type: object
      properties:
        answer:
          oneOf:
          - type: object
            properties:
              selectedOptionId:
                type: string
                minLength: 1
            additionalProperties: false
            required:
            - selectedOptionId
          - type: object
            properties:
              text:
                type: string
                minLength: 1
            additionalProperties: false
            required:
            - text
        responseTimeMs:
          type: integer
          minimum: 0
        clientEventId:
          type: string
          format: uuid
      additionalProperties: false
      required:
      - answer
      - responseTimeMs
      - clientEventId
      example:
        answer:
          selectedOptionId: B
        responseTimeMs: 42000
        clientEventId: 6e5a2f8d-12f0-4f5a-8f35-bb6c4e31ac22
    ApproveGeneratedTaskRequest:
      type: object
      properties:
        targetExamId:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        score:
          type: number
          minimum: 0
          description: Điểm khi thêm vào Exam (bắt buộc nếu có targetExamId).
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        skillCode:
          type: string
        reviewNote:
          type: string
      additionalProperties: false
      description: Tạo Question chính thức (source = AI_PROMOTED) kèm option, ghi promotedQuestionId và AuditLog. Có thể ghi đè difficulty/skillCode.
    RejectGeneratedTaskRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
    UpdateUserStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'
        reason:
          type: string
    LoginResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - accessToken
          - tokenType
          - expiresIn
          - user
          properties:
            accessToken:
              type: string
            tokenType:
              type: string
              example: Bearer
            expiresIn:
              type: integer
              example: 900
            user:
              $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
    Money:
      type: integer
      format: int64
      minimum: 0
      example: 500000
      description: Số tiền VND, số nguyên đồng. Không có trường currency.
    CourseSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        title:
          type: string
        shortDescription:
          type:
          - string
          - 'null'
        thumbnailUrl:
          type:
          - string
          - 'null'
          format: uri
        status:
          $ref: '#/components/schemas/CourseStatus'
        createdAt:
          type: string
          format: date-time
        originalPrice:
          $ref: '#/components/schemas/Money'
        salePrice:
          $ref: '#/components/schemas/Money'
        category:
          $ref: '#/components/schemas/CategorySummary'
        subjectCode:
          type:
          - string
          - 'null'
        gradeLevel:
          type:
          - string
          - 'null'
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
      required:
      - id
      - slug
      - title
      - salePrice
      - status
      - originalPrice
    LessonSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
        lessonType:
          $ref: '#/components/schemas/LessonType'
        position:
          type: integer
          minimum: 1
        durationSeconds:
          type:
          - integer
          - 'null'
          minimum: 0
        preview:
          type: boolean
        mandatory:
          type: boolean
        published:
          type: boolean
      additionalProperties: false
      required:
      - id
      - title
      - lessonType
      - position
    SectionDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        position:
          type: integer
          minimum: 1
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonSummary'
        releaseAfterDays:
          type: integer
          minimum: 0
