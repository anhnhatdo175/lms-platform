openapi: 3.1.0
info:
  title: LMS MVP + AI Adaptive Profile-Based RAG API
  version: 1.5.0
  description: 'OpenAPI 3.1.0 cho LMS MVP + AI Adaptive Profile-Based RAG. Base path: /api/v1. Đồng bộ với Đặc tả nghiệp vụ v3.2, ERD v2.2 và
    Decision Register v0.2.


    Quy ước: response thành công dùng envelope {data: ...}; danh sách dùng {data: [...], meta: {page,size,totalElements,totalPages}}; lỗi dùng
    ErrorResponse với mã ổn định trong ErrorCode; webhook SePay có ack riêng. Tiền là VND số nguyên đồng. Access token dùng BearerAuth; refresh
    token nằm trong cookie HttpOnly refreshToken. Server là nguồn sự thật cho thời lượng video, expiresAt của Attempt và trạng thái khóa Lesson.


    Thay đổi 1.4.0: schema review task AI có đáp án; Attempt có đề snapshot và expiresAt; heartbeat bỏ durationSeconds; lesson bị khóa trả LessonLockedError;
    field Course/Section/Lesson theo ERD; cấu hình ràng buộc AI do Teacher đặt; bổ sung endpoint category, coupon, phân công Teacher, Enrollment
    thủ công, question bank, dashboard, export, reorder curriculum, prerequisite; phân trang gom vào meta; lỗi dùng components/responses.


    Thay đổi 1.5.0: Course bị từ chối phải mở lại (POST reopen) trước khi sửa/gửi duyệt lại; submit-review chỉ từ DRAFT; Student không gửi độ
    khó khi tạo phiên AI (server chọn theo ZPD); tài liệu tri thức ràng buộc sourceType với payload; hint idempotent bằng header Idempotency-Key;
    retry phiên AI có giới hạn; bảng quyết định đối soát thanh toán (review_reason_code, unmatchedReason mới); mọi operation có x-scope MUST/SHOULD/LATER
    theo Đặc tả 5.2; query ID là integer.'
