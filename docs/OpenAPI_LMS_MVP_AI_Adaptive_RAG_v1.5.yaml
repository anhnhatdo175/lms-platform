          $ref: '#/components/schemas/KnowledgeDocumentStatus'
      - name: courseId
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocumentPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/InternalError'
      security:
      - BearerAuth: []
      x-scope: SHOULD
  /admin/ai/adaptive-task-sessions:
    get:
      operationId: adminListAdaptiveTaskSessions
