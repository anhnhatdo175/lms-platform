services:
  # ========================
  # MySQL Database
  # ========================
  db:
    image: mysql:8.4
    container_name: lms-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network

  # ========================
  # S3-compatible object storage
  # ========================
  minio:
    image: bitnamilegacy/minio:2024.12.18-debian-12-r0
    container_name: lms-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lmsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_SKIP_CLIENT: "yes"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - lms-network

  # ========================
  # Spring Boot Backend
  # ========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      APP_JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      APP_JWT_ISSUER: ${JWT_ISSUER:-lms-platform}
      APP_JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      APP_JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-P14D}
      APP_AUTH_REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      LMS_BOOTSTRAP_ADMIN_EMAIL: ${LMS_BOOTSTRAP_ADMIN_EMAIL:-}
      LMS_BOOTSTRAP_ADMIN_PASSWORD: ${LMS_BOOTSTRAP_ADMIN_PASSWORD:-}
      LMS_BOOTSTRAP_ADMIN_NAME: ${LMS_BOOTSTRAP_ADMIN_NAME:-LMS Administrator}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173}
      APP_MAIL_ENABLED: ${SMTP_ENABLED:-false}
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-true}
      APP_MAIL_FROM: ${SMTP_FROM:-}
      APP_AUTH_PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost/}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${SMTP_ENABLED:-false}
      APP_FILE_STORAGE_ENDPOINT: http://minio:9000
      APP_FILE_STORAGE_PUBLIC_ENDPOINT: ${FILE_STORAGE_PUBLIC_ENDPOINT:-http://localhost}
      APP_FILE_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-lmsminio}
      APP_FILE_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      APP_FILE_STORAGE_BUCKET: ${MINIO_BUCKET:-lms-files}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - lms-network

  # ========================
  # React Frontend
  # ========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-LMS}
    container_name: lms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lms-network

volumes:
  db_data:
  minio_data:

networks:
  lms-network:
    driver: bridge
